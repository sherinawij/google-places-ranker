<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ query }} · MapRank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
    <header class="topbar">
        <a class="logo" href="/">MAPRANK</a>
        <form action="/search" method="GET" class="search-form">
            <input class="search-input box" name="query" type="search" value="{{ query }}" autocomplete="off" required>
            <button class="btn box search-btn">SEARCH →</button>
        </form>
    </header>
    <h1 class="page-title">{{ query }}</h1>
    <p class="subtitle">{{ results | length }} places found</p>
    {% if results %}
    <div id="sort-option" class="tabs">
        <button type="button" class="btn tab active" data-sort="weighted">BEST MATCH</button>
        <button type="button" class="btn tab" data-sort="rating">RATING</button>
        <button type="button" class="btn tab" data-sort="review">MOST REVIEWED</button>
    </div>
    <div class="podium" id="podium"></div>
    <div id="places-id"></div>
    {% else %}
    <div class="empty box">
        <h2>No places found</h2>
        <p>Try a different search, like "pizza montreal".</p>
    </div>
    {% endif %}
    </div>
    <script>
        const results = {{ results | tojson }};
        const query = {{ query | tojson }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
