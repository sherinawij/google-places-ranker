<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="container">
    <header class="topbar">
      <a class="logo" href="/">MAPRANK</a>
      <form action="/search" method="GET" id="search-form" class="search-form">
        <input class="search-input box" id="query" name="query" type="search" placeholder="Search a place, e.g. bakery montreal" autocomplete="off" required>
        <button class="btn box search-btn" id="search-btn">SEARCH →</button>
      </form>
    </header>
    {% if error %}
      <p class="error box">{{ error }}</p>
    {% endif %}
  </div>
  <div id="search-results">

  </div>

  <div id="expanded-result">

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
